# QT3 Microscope setup profile for the VQLM.
# Lists what the window shows and the hardware settings for each panel.
QT3MICROSCOPE:
  setup: VQLM
  title: "QT3 Microscope — VQLM"
  geometry: 1440x900
  drawer_width: 390

  # Status strip along the top, left to right.
  status:
    - {key: laser, label: "Laser"}
    - {key: power, label: "P obj"}
    - {key: counts, label: "Scope - SPCM"}
    - {key: piezo, label: "Piezo"}
    - {key: flippers, label: "Flippers"}
    - {key: camera, label: "Camera"}

  # Measurement tabs in the middle.
  # No PLE tab on the VQLM (Kendall, 2026-11-06).
  measurements: ["Camera", "Image scan", "XYZ Optimization"]

  # Strip along the bottom. VQLM micrometers are manual, so no XY box.
  bottom:
    scope_label: "Scope — SPCM"
    xy_micrometers: false

  # Drawer sections, top to bottom. open: starts unfolded.
  drawer:
    - {key: laser, label: "Laser (QICK-DAWG)", open: true}
    - {key: flippers, label: "Flip mirrors", open: true}
    - {key: power, label: "Power at objective", open: true}
    - {key: stage, label: "Stage (piezos)", open: false}
    # No Pulse Blaster section on the VQLM (Kendall, 2026-11-06).

  # Hardware settings. A drawer section gets a working panel when its
  # hardware is listed here.
  hardware:
    # Snapshots go to the first reachable snapshot_dirs entry (default: the
    # M drive, M:\qt3microscope_camera or \\host-m.coral.uw.edu\mhome\...),
    # else Documents\qt3microscope_camera. Add e.g. snapshot_dirs: ['M:\my_folder'].
    # Camera tab (qt3camera): Thorlabs CS165MU over USB, via the Thorlabs
    # Scientific Camera SDK that comes with ThorCam (close ThorCam first).
    # dll_dir: folder with thorlabs_tsi_camera_sdk.dll; empty tries the ThorCam folders.
    # serial: empty uses the first Thorlabs camera found.
    # driver: fake shows a test image instead.
    camera: {driver: thorlabs_tsi, label: "Thorlabs CS165MU", serial: , dll_dir: ,
             exposure_ms: 10, gain_db: 0, display_fps: 30}
    # QICK-DAWG board that switches the laser (same values as qt3laser).
    qickdawg: {host: 192.168.3.1, port: 8888, server_name: myqick, timeout_s: 10, health_check_s: 30}
    laser: {laser_gate_pmod: 0, adc_channel: 0, edge_counting: true,
            high_threshold: 8000, low_threshold: 500, relax_delay_tns: 50}
    # Scope strip: SPCM on a DAQ counter (formerly qdlscope; same values
    # as its qdlscope_base.yaml). sample_time is the starting time per sample.
    scope: {daq_name: Dev1, signal_terminal: PFI0, signal_counter: ctr2, clock_rate: 100000,
            clock_terminal: "", read_write_timeout: 10, sample_time: 0.01}
    # Photodetector(s) on the NI DAQ. v_to_mw is a polynomial in volts,
    # highest power first; this is the VQLM qt3power quadratic.
    power:
      device: Dev1
      interval_ms: 200
      samples: 10
      auto_start: true
      detectors:
        - {name: PDA100A2, channel: ai4, label: "Excitation", v_to_mw: [7.5461e-4, 0.64023, -8.3511e-3]}
    # Stage drawer (formerly qdlmove; values from qdlmove_base.yaml).
    # Each axis builds its positioner from import_path/class_name/configure.
    # step: starting step size (µm) for arrow-key stepping.
    stage:
      title: Piezos
      precision: 2
      step: 0.1
      axes:
        - label: X
          import_path: qt3utils.hardware.nidaq.analogoutputs.nidaqposition
          class_name: NidaqPositionController
          configure: {device_name: Dev1, write_channel: ao0, read_channel: , move_settle_time: 0.0,
                      scale_microns_per_volt: 8, zero_microns_volt_offset: 5,
                      min_position: -40.0, max_position: 40.0, invert_axis: true}
        - label: Y
          import_path: qt3utils.hardware.nidaq.analogoutputs.nidaqposition
          class_name: NidaqPositionController
          configure: {device_name: Dev1, write_channel: ao1, read_channel: , move_settle_time: 0.0,
                      scale_microns_per_volt: 8, zero_microns_volt_offset: 5,
                      min_position: -40.0, max_position: 40.0, invert_axis: true}
        # Z is not inverted: qdlscan's direction (qdlmove had it inverted).
        - label: Z
          import_path: qt3utils.hardware.nidaq.analogoutputs.nidaqposition
          class_name: NidaqPositionController
          configure: {device_name: Dev1, write_channel: ao2, read_channel: , move_settle_time: 0.0,
                      scale_microns_per_volt: 8, zero_microns_volt_offset: 5,
                      min_position: -40.0, max_position: 40.0, invert_axis: false}
    # Image scan and line scan tabs (formerly qdlscan). They use the stage
    # piezos above and the scope's SPCM counter; the scope pauses during a
    # scan and resumes after. range/range_xy/range_z in µm, time in s/row
    # (image) or s/line (line scan).
    scan:
      inter_scan_settle_time: 0.01
      # mode: raster or snake; as VQLM qdlscan: every row left to right, then a ramp back. Snake rows shifted edges row to row (Kendall, 2026-11-09).
      image: {range: 80, pixels: 80, time: 1, mode: raster}
      line: {range_xy: 3, range_z: 20, pixels: 50, time: 1}
    # Flip mirrors (same layout as the VQLM qt3mirror_base.yaml).
    flippers:
      device: Dev1
      sync_pulse_low_ms: 15.0
      sync_pulse_high_ms: 15.0
      flippers:
        - {name: M5, line: port1/line2}
        - {name: M6, line: port1/line3}
        - {name: M7, line: port1/line4}
        - {name: M8, line: port1/line5}
      # Automatic switching (File > Preferences): which mirrors move when the
      # Camera tab opens ("camera") and when the scan tabs open or a scan or the
      # scope starts ("counter"). M5 (532 nm / SuperK) is not listed, so the
      # excitation choice stays. counter = the Confocal presets (M8 up).
      auto:
        camera: {M6: up, M7: down}
        counter: {M6: down, M8: up}
      presets:
        - {label: "532nm - Camera", targets: {M5: up, M6: up, M7: down}}
        - {label: "532nm - SPCM - Confocal", targets: {M5: up, M6: down, M8: up}}
        - {label: "532nm - SPCM - g(2)", targets: {M5: up, M6: down, M8: down}}
        - {label: "532nm - Spectrometer", targets: {M5: up, M6: up, M7: up}}
        - {label: "SuperK - Camera", targets: {M5: down, M6: up, M7: down}}
        - {label: "SuperK - SPCM - Confocal", targets: {M5: down, M6: down, M8: up}}
        - {label: "SuperK - SPCM - g(2)", targets: {M5: down, M6: down, M8: down}}
        - {label: "SuperK - Spectrometer", targets: {M5: down, M6: up, M7: up}}
